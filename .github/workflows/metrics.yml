name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: ./metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # 关键：只使用仓库插件，不用 base: repositories
          plugin_repositories: yes
          repositories_affiliations: owner, collaborator, organization_member
          repositories_skipped: ""                    # 不跳过任何仓库
          repositories_mode: list                     # 可选：以列表形式显示（更紧凑）
          output_action: none                         # 关闭插件自动提交

      - name: Copy image to repo
        run: cp /metrics_renders/metrics.svg ./metrics.svg

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add metrics.svg
          git commit -m "Update metrics" || true
          git push
