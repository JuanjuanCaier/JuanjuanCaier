name: Update Repo List
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Fetch all repositories and generate list
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.METRICS_TOKEN }}
          script: |
            const fs = require('fs');
            
            // 获取所有仓库
            let allRepos = [];
            let page = 1;
            let perPage = 100;
            
            while (true) {
              const repos = await github.rest.repos.listForAuthenticatedUser({
                visibility: 'all',
                affiliation: 'owner,collaborator,organization_member',
                per_page: perPage,
                page: page
              });
              
              if (repos.data.length === 0) break;
              
              // 过滤掉 Fork 的仓库
              const nonForks = repos.data.filter(repo => !repo.fork);
              allRepos = allRepos.concat(nonForks);
              
              if (repos.data.length < perPage) break;
              page++;
            }

            // 按最近更新时间排序
            allRepos.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

            // 生成 Markdown 内容
            let markdown = `## 📦 我参与的所有项目\n\n`;
            markdown += `| 仓库 | 描述 | Stars | 更新时间 |\n`;
            markdown += `|------|------|-------|----------|\n`;
            
            allRepos.forEach(repo => {
              const updatedAt = new Date(repo.updated_at).toLocaleDateString('zh-CN');
              const description = repo.description || '暂无描述';
              markdown += `| [${repo.full_name}](${repo.html_url}) | ${description} | ⭐ ${repo.stargazers_count} | ${updatedAt} |\n`;
            });

            // 读取现有 README
            let readme = fs.readFileSync('README.md', 'utf8');
            
            // 替换特定标记之间的内容
            const startMarker = '<!-- AUTO_REPO_LIST_START -->';
            const endMarker = '<!-- AUTO_REPO_LIST_END -->';
            
            const startIndex = readme.indexOf(startMarker);
            const endIndex = readme.indexOf(endMarker);
            
            if (startIndex !== -1 && endIndex !== -1) {
              const newReadme = readme.substring(0, startIndex + startMarker.length) + 
                                '\n\n' + markdown + '\n' + 
                                readme.substring(endIndex);
              fs.writeFileSync('README.md', newReadme);
              console.log('README updated successfully!');
            } else {
              console.log('Markers not found in README. Please add them.');
              // 如果没找到标记，把生成的内容打印出来
              console.log('\nGenerated content:\n');
              console.log(markdown);
            }

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "chore: update repository list" || true
          git push
