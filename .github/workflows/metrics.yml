name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          filename: ./metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_repositories: yes
          # 抓取所有自有/协作/组织仓库
          repositories_affiliations: owner,collaborator,organization_member
          # 列出所有仓库，每个带跳转链接
          repositories_list: all
          # 最多展示100个仓库
          repositories_limit: 100
          # 按最近更新时间排序
          repositories_sort: updated
          # 显示仓库描述
          repositories_description: yes
          # 显示Star数
          repositories_stars: yes
          # 不显示Fork的仓库
          repositories_forks: no
          output_action: none

      - name: Copy image to repo
        run: cp /metrics_renders/metrics.svg ./metrics.svg

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add metrics.svg
          git commit -m "chore: update metrics" || true
          git push
